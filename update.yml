name: Update Smart Data scanner (Version A - feeds)
on:
  schedule: [{ cron: "0 6 * * *" }]   # daily 06:00 UTC
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python version-a-static/fetch_feeds.py
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      - run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add version-a-static/data/announcements.json
          git commit -m "Daily update" || echo "no changes"
          git push
